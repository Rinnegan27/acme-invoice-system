name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  offline:
    name: Offline quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies (frozen lockfile)
        run: uv sync --frozen --extra dev

      - name: Guard — core/ must not reappear
        run: |
          if [ -d core ]; then
            echo "FATAL: dead legacy package core/ must not exist"
            exit 1
          fi

      # Same offline gates as local `make check` + scenario proof.
      # Sync stays frozen above; do not run `make build` here (it re-syncs).
      - name: Lint + offline tests (make check)
        run: make check

      - name: Case scenario proof
        run: make scenario-proof

  live_grok:
    name: Live Grok smoke (optional)
    runs-on: ubuntu-latest
    needs: offline
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --extra dev

      - name: Live Grok contract
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: grok-3
          GALATIQ_PERMIT_SECRET: ci-test-secret-do-not-use-in-prod
        run: |
          if [ -z "$XAI_API_KEY" ]; then
            echo "No XAI_API_KEY secret — skipping live Grok"
            exit 0
          fi
          uv run pytest -q -m live_grok
